<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self';" />
    <title>Navigation</title>
    <link rel="stylesheet" href="nav.css" />
  </head>
  <body>
    <div class="nav-group site-tabs">
      <button id="tab-hunyuan" class="nav-btn tab active" title="Hunyuan3D — generate models">Hunyuan3D</button>
      <button id="tab-mixamo" class="nav-btn tab" title="Mixamo — rig and animate characters">Mixamo</button>
      <button id="tab-polypizza" class="nav-btn tab" title="Poly Pizza — free premade low-poly models">Poly Pizza</button>
    </div>
    <div class="nav-sep"></div>
    <div class="nav-group">
      <button id="zoom-out" class="nav-btn" title="Zoom out">&#8722;</button>
      <button id="zoom-reset" class="nav-btn zoom-label" title="Reset zoom to 100%">100%</button>
      <button id="zoom-in" class="nav-btn" title="Zoom in">+</button>
    </div>
    <div class="nav-sep"></div>
    <div class="nav-group">
      <button id="back" class="nav-btn" title="Back">&#10094;</button>
      <button id="forward" class="nav-btn" title="Forward">&#10095;</button>
      <button id="reload" class="nav-btn" title="Reload page">&#8635;</button>
    </div>
    <script src="nav.js"></script>
  </body>
</html>
